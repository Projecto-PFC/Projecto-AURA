services:
  postgres:
    image: postgres:16          # versão fixa — evita surpresas no futuro
    container_name: aura_db    # nome do container no Docker
    restart: unless-stopped    # reinicia automaticamente se o PC reiniciar
    environment:
      POSTGRES_USER: postgres    # usuário padrão do PostgreSQL
      POSTGRES_PASSWORD: postgres # senha padrão do PostgreSQL
      POSTGRES_DB: aura          # nome da base de dados
    ports:
      - "5432:5432"             # maquina_local:container
    volumes:
      - aura_data:/var/lib/postgresql/data  # persiste dados no disco

volumes:
  aura_data:                      # define o volume nomeado